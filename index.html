<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
    <title>TELV</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="layout.css"> <!-- External CSS file -->
    <style>
        /* Prevent text selection */
        body, .container, .countdown-wrapper {
            -webkit-user-select: none; /* For Safari */
            -moz-user-select: none; /* For Firefox */
            -ms-user-select: none; /* For Internet Explorer/Edge */
            user-select: none; /* Standard property */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Wrapper for logo and countdown -->
        <div class="countdown-wrapper">
            <!-- Logo positioned above the timer -->
            <img src="logo.png" alt="TELV Logo" class="logo">
            
            <!-- Countdown Timer -->
            <div id="countdown" class="countdown">
                <div class="time-unit">
                    <div id="days" class="number">0</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-unit">
                    <div id="hours" class="number">0</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-unit">
                    <div id="minutes" class="number">0</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-unit">
                    <div id="seconds" class="number">0</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>

        <footer>&copy; 2026 TELV</footer>
    </div>

    <!-- Social Links at the Bottom -->
    <div class="social-links">
        <a href="https://discord.gg/Tf6Kx83ZtG" target="_blank" class="social-icon">
            <img src="discord-logo.png" alt="Discord" class="icon">
        </a>
        <a href="https://x.com/tacolv" target="_blank" class="social-icon twitter">
            <img src="twitter-x-logo.png" alt="Twitter X" class="icon">
            <span class="profile-preview">
                <img src="https://pbs.twimg.com/profile_images/2059054087233007616/lCo9RfUa_400x400.jpg" alt="TacoLV preview" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;64&quot; height=&quot;64&quot;><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;%23dddddd&quot;/><text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; fill=&quot;%23888888&quot; font-size=&quot;24&quot;>?</text></svg>'">
            </span>
        </a>
    </div>

    <script>
        // Countdown logic for global countdown to the end of the current year
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const endOfYear = new Date(currentYear + 1, 0, 1); // Midnight of January 1

            const timeLeft = endOfYear - now;

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        // Prevent right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); // Disable right-click context menu
        });

        // Prevent copy event
        document.addEventListener('copy', function(e) {
            e.preventDefault(); // Prevent copy event
            alert("Copying text is disabled.");
        });

        // Update the countdown every second
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initialize countdown immediately
    </script>
</body>
</html>
